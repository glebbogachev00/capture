    <rect x="136" y="134" width="240" height="28" rx="14" opacity="0.38"/>
    <rect x="136" y="188" width="164" height="28" rx="14" opacity="0.52"/>
    <rect x="136" y="242" width="216" height="28" rx="14" opacity="0.66"/>
    <rect x="136" y="296" width="128" height="28" rx="14" opacity="0.8"/>
    <rect x="136" y="350" width="192" height="28" rx="14"/>
  </g>
</svg>
