<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="capture">
  <rect width="512" height="512" fill="#2F5D3F"/>
  <!--
    The sediment motif from the thread cards: fragments settling, each layer
    a little more solid than the one above it. Kept inside the centre 60% so
    a maskable crop can't clip it.
