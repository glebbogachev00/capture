<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Capture</title>
<script>if (!location.hash) document.documentElement.className = "leaving";</script>
<style>
  :root { --paper: #edefe8; --card: #f8f9f5; --ink: #191d19; --muted: #60685e; --rule: #dbdfd3; --accent: #2f5d3f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  body { font: 17px/1.45 -apple-system, system-ui, sans-serif; display: flex; }
  .leaving main { visibility: hidden; }
  main { margin: auto; width: 100%; max-width: 420px; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
  h1 { font: 500 28px/1.2 ui-serif, Georgia, serif; margin: 0 0 8px; letter-spacing: -0.01em; }
  p { margin: 0 0 24px; color: var(--muted); }
  input { width: 100%; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; outline: none; margin-bottom: 12px; }
  input:focus { border-color: var(--accent); }
  [hidden] { display: none !important; }
  button { width: 100%; font: 600 17px/1 -apple-system, system-ui, sans-serif; color: var(--paper); background: var(--ink); border: 0; border-radius: 12px; padding: 16px; }
  button:active { opacity: 0.8; }
  a { display: block; margin-top: 16px; text-align: center; color: var(--muted); font-size: 15px; text-decoration: none; }
  .note { min-height: 1.45em; margin: 12px 0 0; font-size: 15px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Use your own server</h1>
  <p id="lede">Your Mac's Tailscale address. This phone opens it from now on.</p>
  <form>
    <input id="server" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="your-mac.tailnet.ts.net:8446" aria-label="Server address">
    <button type="submit" id="go">Open</button>
    <p class="note" id="note" role="status"></p>
  </form>
  <a href="#" id="back">Back to Capture</a>
  <a href="#" id="free" hidden>Use the free version</a>
</main>
<script>
  // The iPhone app opens Capture from a server: the free version by default,
  // whichever board the person last reached (Cloud, their own Mac), or one
  // they choose here. This page only shows when that server can't be reached
  // (#unreachable) or from Settings → "Use another server" (#choose).
  const FREE = "https://www.trycapture.app/app";
  const native = (method, options) => window.Capacitor?.nativePromise
    ? window.Capacitor.nativePromise("CaptureShell", method, options)
    : Promise.reject(new Error("no bridge"));
  const home = () => native("home").then((r) => r.url || FREE, () => FREE);
  const open = (url) => native("setHome", { url }).catch(() => {}).then(() => location.replace(url));

  // Mirrors server.allowNavigation in capacitor.config.json; any other host
  // would open in Safari. A board lives at /app on trycapture.app, at / on a Mac.
  function boardFor(value) {
    const text = value.trim();
    if (!text) return null;
    try {
      const url = new URL(/^https?:\/\//i.test(text) ? text : "https://" + text);
      if (url.protocol !== "https:") return null;
      if (/^([^.]+\.)?trycapture\.app$/.test(url.hostname)) return url.origin + "/app";
      if (/^[^.]+\.[^.]+\.ts\.net$/.test(url.hostname)) return url.origin + "/";
      return null;
    } catch { return null; }
  }

  window.onerror = (message) => { document.documentElement.className = ""; document.getElementById("note").textContent = String(message); };
  const mode = location.hash.slice(1);
  if (!mode) {
    home().then((url) => location.replace(url));
  } else {
    const $ = (id) => document.getElementById(id);
    home().then((url) => {
      const own = /\.ts\.net$/.test(new URL(url).hostname);
      $("server").value = own ? url.replace(/^https:\/\//, "").replace(/\/$/, "") : "";
      if (mode === "unreachable") {
        $("title").textContent = own ? "Couldn't reach your Mac" : "You're offline";
        $("lede").textContent = own
          ? "Check that Tailscale is on, on this phone and on the Mac."
          : "Capture opens again when you're back online.";
        $("go").textContent = "Try again";
        $("server").hidden = !own;
        $("back").hidden = !own;
        $("back").textContent = "Use the free version instead";
      }
      $("free").hidden = mode !== "choose" || url === FREE;
      $("free").onclick = (event) => { event.preventDefault(); open(FREE); };
      $("back").onclick = (event) => {
        event.preventDefault();
        if (mode === "unreachable") open(FREE); else location.replace(url);
      };
      document.querySelector("form").onsubmit = (event) => {
        event.preventDefault();
        if ($("server").hidden) return location.replace(url);
        const board = boardFor($("server").value);
        if (!board) { $("note").textContent = "Use your Mac's Tailscale address, like your-mac.tailnet.ts.net:8446."; return; }
        open(board);
      };
    });
  }
</script>
</body>
</html>
